<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Admin – Telangana Bakery</title><style>
:root{--p:#ff008e;color-scheme:light dark}body{font:15px system-ui,sans-serif;margin:0;padding:16px;max-width:900px;margin:auto}h1{color:var(--p)}input,select{padding:8px;border-radius:8px;border:1px solid #8886;margin:2px 0;font:inherit;background:transparent;color:inherit}
.b{background:var(--p);color:#fff;border:0;border-radius:10px;padding:9px 16px;font-weight:700;cursor:pointer}.o{border:1px solid #8885;border-radius:14px;padding:12px;margin:10px 0;white-space:pre-wrap}.r{display:grid;grid-template-columns:46px 1fr 70px 1fr 1fr 30px;gap:4px}.pill{background:var(--p);color:#fff;border-radius:99px;padding:1px 10px;font-size:12px}</style></head><body>
<h1>Telangana Bakery – Admin</h1><div id="app"></div><script>
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));let T=sessionStorage.t||'',menu=[],fee=0,upi='',steps=[],orders=[];
const A=(u,o={})=>fetch(u,{...o,headers:{'Content-Type':'application/json','x-token':T}}).then(async r=>({ok:r.ok,j:await r.json()}));
function login(){$('#app').innerHTML='<input id="pw" type="password" placeholder="Admin password"> <button class="b" onclick="go()">Login</button>'}
async function go(){const r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:$('#pw').value})}),j=await r.json();if(!r.ok)return alert(j.error);T=j.token;sessionStorage.t=T;init()}
async function init(){const a=await A('/api/admin/orders');if(!a.ok)return login();orders=a.j.orders;steps=a.j.steps;const m=await A('/api/admin/menu');menu=m.j.menu;fee=m.j.fee;upi=m.j.upi||'';draw()}
function draw(){const st=$('#app').dataset.keep;$('#app').innerHTML=`<h2>Orders (${orders.length})</h2><button class="b" onclick="init()">Refresh</button>${orders.map(o=>`<div class="o"><b>${esc(o.id)}</b> <span class="pill">${esc(o.status)}</span> ${o.paid?'✓ Paid':'Unpaid'} (${o.pay})\n${esc(new Date(o.created).toLocaleString())}\n${o.lines.map(l=>esc(l.n)+' × '+l.q).join(', ')} — Total ₹${o.total}\n${esc(o.name)} · ${esc(o.phone)}\n${esc(o.addr)}${o.note?'\nNote: '+esc(o.note):''}${o.utr?'\nCustomer’s UTR: '+esc(o.utr):''}\n<select onchange="setS('${o.id}',this.value)">${steps.map(s=>`<option ${s==o.status?'selected':''}>${s}</option>`).join('')}</select>${o.pay==='upi'&&!o.paid?` <button class="b" onclick="paid('${o.id}')">Payment received ✓</button>`:''}</div>`).join('')}
<h2>Menu</h2><label>Delivery fee ₹ <input type="number" value="${fee}" oninput="fee=+this.value"></label><br><label>Owner UPI ID for QR payments <input value="${esc(upi)}" oninput="upi=this.value" placeholder="name@bank"></label>${menu.map((m,i)=>`<div class="r"><input value="${esc(m.em)}" oninput="menu[${i}].em=this.value"><input value="${esc(m.name)}" oninput="menu[${i}].name=this.value"><input type="number" value="${+m.price}" oninput="menu[${i}].price=+this.value"><input value="${esc(m.cat)}" oninput="menu[${i}].cat=this.value"><input value="${esc(m.desc)}" oninput="menu[${i}].desc=this.value"><button onclick="menu.splice(${i},1);draw()">🗑</button></div><div style="margin:2px 0 10px 46px;font-size:13px">${m.img?`<img src="${esc(m.img)}" height="40" style="vertical-align:middle;border-radius:6px"> `:''}Photo: <input type="file" accept="image/*" onchange="up(${i},this)"></div>`).join('')}
<p><button class="b" onclick="menu.push({id:'m'+Date.now(),cat:'Cakes',em:'🧁',name:'New item',desc:'',price:50});draw()">+ Add item</button> <button class="b" onclick="saveM()">Save menu</button></p>`}
async function setS(id,s){const r=await A('/api/admin/orders/'+id,{method:'POST',body:JSON.stringify({status:s})});if(!r.ok)alert(r.j.error);init()}
async function paid(id){const r=await A('/api/admin/orders/'+id+'/paid',{method:'POST',body:'{}'});if(!r.ok)alert(r.j.error);init()}
async function up(i,el){const f=el.files[0];if(!f)return;try{const b=await createImageBitmap(f),s=Math.min(1,1000/Math.max(b.width,b.height)),c=document.createElement('canvas');c.width=Math.round(b.width*s);c.height=Math.round(b.height*s);c.getContext('2d').drawImage(b,0,0,c.width,c.height);const blob=await new Promise(y=>c.toBlob(y,'image/jpeg',.82)),r=await fetch('/api/admin/upload',{method:'POST',headers:{'Content-Type':'image/jpeg','x-token':T},body:blob}),j=await r.json();if(!r.ok)return alert(j.error);menu[i].img=j.url;draw()}catch(e){alert('Could not read that image')}}
async function saveM(){const r=await A('/api/admin/menu',{method:'PUT',body:JSON.stringify({menu,fee,upi})});alert(r.ok?'Menu saved':r.j.error)}
T?init():login();setInterval(()=>{if(T&&!document.activeElement.matches('input,select'))init()},30000)</script></body></html>
