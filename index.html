<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Telangana Bakery – Cakes & More</title><link rel="icon" href="logo.png"><style>
:root{--p:#ff008e;--bg:#fff6fa;--cd:#fff;--tx:#2b1020;--mu:#7a5a6b;--bd:#f7d2e3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#1c0b14;--cd:#2a1220;--tx:#ffeaf4;--mu:#d6a5bd;--bd:#4a2036;color-scheme:dark}}
:root[data-theme=dark]{--bg:#1c0b14;--cd:#2a1220;--tx:#ffeaf4;--mu:#d6a5bd;--bd:#4a2036;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding-bottom:84px}
header{background:linear-gradient(160deg,var(--p),#b8005f);color:#fff;text-align:center;padding:34px 16px 30px;border-radius:0 0 36px 36px;box-shadow:0 10px 30px rgba(255,0,142,.25)}header h1{font:600 clamp(26px,5vw,38px)/1.2 Georgia,'Times New Roman',serif;margin:14px 0 0;letter-spacing:.3px}.perks{display:flex;gap:8px 20px;justify-content:center;flex-wrap:wrap;margin-top:16px;font-size:13px;font-weight:600;letter-spacing:.4px;text-transform:uppercase;opacity:.95}.ct{margin:10px 0 6px;font-size:15px}.ct a{color:var(--p);font-weight:700;text-decoration:none}
header img{width:150px;height:auto;filter:drop-shadow(0 6px 14px rgba(0,0,0,.3))}
header p{margin:8px auto 0;max-width:520px;opacity:.92}
nav{display:flex;gap:8px;overflow-x:auto;padding:14px 16px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
nav button{flex:none;border:1.5px solid var(--p);background:var(--cd);color:var(--p);padding:8px 16px;border-radius:99px;font-weight:600;cursor:pointer}
nav button.on{background:var(--p);color:#fff}
main{max-width:900px;margin:auto;padding:0 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:6px;box-shadow:0 2px 10px rgba(0,0,0,.05);transition:transform .15s,box-shadow .15s}.card:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(255,0,142,.15)}
.em{font-size:58px;text-align:center;background:linear-gradient(145deg,var(--bg),var(--bd));border-radius:14px;padding:18px 8px}
.card h3{margin:4px 0 0;font-size:17px}.card .d{color:var(--mu);font-size:14px;flex:1}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}.pr{font-weight:700;color:var(--p);font-size:18px}
button.add,.btn{background:var(--p);color:#fff;border:0;border-radius:12px;padding:9px 16px;font-weight:700;cursor:pointer;font-size:15px}
.qty{display:flex;align-items:center;gap:10px;font-weight:700}.qty button{width:32px;height:32px;border-radius:50%;border:0;background:var(--p);color:#fff;font-size:18px;cursor:pointer}
#bar{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));background:var(--p);color:#fff;border-radius:16px;padding:14px 18px;display:none;justify-content:space-between;font-weight:700;cursor:pointer;z-index:9;box-shadow:0 6px 20px rgba(255,0,142,.4)}
dialog{border:0;border-radius:20px;background:var(--cd);color:var(--tx);width:min(460px,94vw);max-height:90vh;padding:20px}
dialog::backdrop{background:rgba(0,0,0,.5)}
input,select,textarea{width:100%;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font:inherit;margin:4px 0 10px}
label{font-size:13px;color:var(--mu)}.ln{display:flex;justify-content:space-between;padding:4px 0}
#adm{display:none;background:var(--cd);border:2px dashed var(--p);border-radius:18px;padding:16px;margin:16px 0}
#adm .ir{display:grid;grid-template-columns:50px 1fr 70px 1fr 32px;gap:6px}#adm input{margin:2px 0;padding:6px}
#adm .ir button{background:none;border:0;cursor:pointer;font-size:18px}
.o{border-top:1px solid var(--bd);padding:8px 0;font-size:14px;white-space:pre-wrap}
footer{text-align:center;color:var(--mu);padding:30px 16px;font-size:14px}

.trk{background:var(--p)!important;color:#fff!important;margin-left:auto}.stp{display:flex;gap:4px;margin:14px 0}.stp div{flex:1;text-align:center;font-size:11px;color:var(--mu)}.stp i{display:block;height:6px;border-radius:9px;background:var(--bd);margin-bottom:5px}.stp .on i{background:var(--p)}.stp .on{color:var(--p);font-weight:700}.pill{display:inline-block;padding:2px 10px;border-radius:99px;background:var(--bd);font-size:12px;font-weight:700}.ph{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:14px}</style></head><body>
<header><img src="logo.png" alt="Telangana Bakery logo"><h1>Freshly baked, delivered to your door</h1><p>Fresh cakes, puffs & snacks – order online, pay securely, track live</p><div class="perks"><span>✓ Baked fresh daily</span><span>✓ Home delivery</span><span>✓ Serving since 2012</span></div></header><nav id="tabs"></nav><main><div id="list"></div></main><div id="bar" onclick="openCart()"><span id="bc"></span><span id="bt"></span></div><dialog id="dlg"></dialog>
<footer><b style="color:var(--tx);font-size:17px">Telangana Bakery</b><br>Cakes & More · Since 2012<br>© Telangana Bakery. All rights reserved.</footer>
<script src="app.js"></script></body></html>
